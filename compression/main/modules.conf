# The module loaded last answers a client that accepts both: brotli, which compresses a proxied response
# further than zstd at a comparable cost.
load_module /usr/local/openresty/nginx/modules/ngx_http_zstd_filter_module.so;
load_module /usr/local/openresty/nginx/modules/ngx_http_brotli_filter_module.so;
