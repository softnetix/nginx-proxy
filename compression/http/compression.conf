gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/javascript text/css text/plain text/xml application/xml image/svg+xml;

brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types application/json application/javascript text/javascript text/css text/plain text/xml application/xml image/svg+xml;

zstd on;
zstd_comp_level 9;
zstd_min_length 1024;
zstd_types application/json application/javascript text/javascript text/css text/plain text/xml application/xml image/svg+xml;
